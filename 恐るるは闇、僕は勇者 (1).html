            writeText(`\n🔮【使い魔強化】${cost}個の${reqMat}を捧げ、使い魔『${famName}』は Lv.${currentLvl + 1} に昇華した！`);
            saveGame();
            renderTabContent();
        }

        // 使い魔同行
        function equipFamiliar(famName) {
            gameState.familiar = famName;
            const lvl = gameState.familiarLevels[famName] || 1;
            writeText(`\n🔮【使い魔】『${famName}』(Lv.${lvl}) が同行し、加護を与える。`);

            renderTabContent();

        function unequipFamiliar() {

            } else {
                executeDamageCalculation(wp.attr, 1, 1.0, "normal");
            }

            updateBattleHud();

            if (gameState.activeEnemy && gameState.activeEnemy.hp > 0) {
                setTimeout(enemyTurn, 1000);
            }
        }

        // スキル発動処理
        function triggerPlayerSkill(skillName) {
            setChoices([]);
            clearText();
            const wp = getDynamicItemStats(gameState.mainHand) || { type: "素手", attr: "物理" };
            
            writeText(`✨ 【スキル発動】 ${gameState.playerName}の${skillName}！`);

            gameState.skillCooldown = 3;

            switch(skillName) {
                case "魔斬撃":
                    executeDamageCalculation(wp.attr, 1, 1.0, "skill");
                    gameState.playerBuffs.swordAtkBuff = 3;
                    writeText(`➔ 【魔斬撃効果】 ${gameState.playerName}の闘志が燃え上がり、3ターンの間、攻撃力が10%+5上昇！`);
                    break;

                case "クイックプル":
                    writeText(`➔ 連続攻撃の刃が影を裂く！`);
                    executeDamageCalculation(wp.attr, 1, 0.6, "skill");
                    if (gameState.activeEnemy && gameState.activeEnemy.hp > 0) {
                        executeDamageCalculation(wp.attr, 2, 0.6, "skill");
                    }
                    if (Math.random() < 0.05) {
                        gameState.skillCooldown = 0;
                        writeText(`⚡ 【クールダウン解消！】 奇跡的な手返し！スキルのクールダウンが即時解消された！`);
                    }
                    break;

                case "アーケインサージ":
                    executeDamageCalculation(wp.attr, 1, 0.9, "skill");
                    if (gameState.activeEnemy && gameState.activeEnemy.hp > 0) {
                        if (Math.random() < 0.60) {
                            writeText(`✨ 【アーケインサージ効果】 魔力が共鳴し、高確率で武器属性効果を誘発！`);
                            triggerAttributeEffect(wp.attr, true);
                        }
                    }
                    break;

                case "特大ギロチン":
                    executeDamageCalculation(wp.attr, 1, 1.6, "skill");
                    break;

                case "十六夜突き":
                    writeText(`➔ 目にも留まらぬ三連突きが敵を穿つ！`);
                    executeDamageCalculation(wp.attr, 1, 0.4, "skill");
                    if (gameState.activeEnemy && gameState.activeEnemy.hp > 0) {
                        executeDamageCalculation(wp.attr, 2, 0.4, "skill");
                    }
                    if (gameState.activeEnemy && gameState.activeEnemy.hp > 0) {
                        executeDamageCalculation(wp.attr, 3, 0.4, "skill");
                    }
                    break;

                case "兜割り":
                    executeDamageCalculation(wp.attr, 1, 0.9, "skill");
                    gameState.enemyStates.defDown = 2;
                    writeText(`➔ 【兜割り効果】 敵の硬い装甲を粉砕した！2ターンの間, 敵の防御力を50%減少させる！`);
                    break;

                case "骨潰しの一撃":
                    executeDamageCalculation(wp.attr, 1, 1.1, "skill");
                    gameState.enemyStates.atkDown = 2;
                    writeText(`➔ 【骨潰し効果】 敵の攻撃力を2ターンの間15%減少させる！`);
                    break;

                case "ドレインボルト":
                    executeDamageCalculation(wp.attr, 1, 0.7, "skill");
                    gameState.playerBuffs.drainBoltCount = 5;
                    writeText(`➔ 【ドレインボルト効果】 次の5回までの通常攻撃時, 与えたダメージの20%を回復する！`);
                    break;

                case "心臓裂き":
                    const enemy = gameState.activeEnemy;
                    if (enemy) {
                        const hpRatio = enemy.hp / enemy.maxHp;
                        if (hpRatio <= 0.30) {
                            writeText(`☠️ 敵の体力が残り僅か(30%以下)！急所を完璧に捉えた！`);
                            executeDamageCalculation(wp.attr, 1, 1.9, "skill");
                        } else {
                            executeDamageCalculation(wp.attr, 1, 1.1, "skill");
                        }
                    }
                    break;

                default:
                    executeDamageCalculation(wp.attr, 1, 1.0, "skill");
                    break;
            }

            updateBattleHud();

            if (gameState.activeEnemy && gameState.activeEnemy.hp > 0) {
                setTimeout(enemyTurn, 1000);
            }
        }

        // ダメージ計算と属性発動判定
        function executeDamageCalculation(attr, hitCount, scale = 1.0, actionType = "normal") {
            const enemy = gameState.activeEnemy;
            if (!enemy) return;

            let targetDef = enemy.def;
            if (gameState.enemyStates.defDown > 0) {
                targetDef = Math.floor(targetDef * 0.5);
            }

            let baseDmg = Math.floor(getPlayerTotalAtk() * scale) - targetDef;
            if (baseDmg <= 0) baseDmg = 1;

            const critChance = getPlayerCritChance();
            if (attr === "物理" && Math.random() < critChance) {
                const critMult = getPlayerCritDmgMultiplier();
                baseDmg = Math.floor(baseDmg * critMult);
                writeText(`💥 会心の一撃！ クリティカル倍率${critMult.toFixed(1)}倍が発動！`);
            }

            if (actionType === "normal" && gameState.playerBuffs.drainBoltCount > 0) {
                const healAmt = Math.floor(baseDmg * 0.20);
                if (healAmt > 0) {
                    const pMaxHp = getPlayerMaxHp();
                    gameState.playerHp = Math.min(pMaxHp, gameState.playerHp + healAmt);
                    writeText(`💧 【ドレイン】 体力を ${healAmt} 回復！`);
                    gameState.playerBuffs.drainBoltCount--;
                }
            }

            enemy.hp -= baseDmg;
            writeText(`自身の一撃：${enemy.name}に ${baseDmg} のダメージを与えた！`);
            updateBattleHud();

            if (enemy.hp <= 0) {
                enemy.hp = 0;
                updateBattleHud();
                writeText(`\n✨ 【勝利】 『${enemy.name}』を討伐した！`);
                endBattle(true);
                return;
            }

            // 属性効果の発動判定
            let procChance = 0.25;
            const famLvl = gameState.familiarLevels[gameState.familiar] || 1;

            const offData = getDynamicItemStats(gameState.offHand);
            if (offData && offData.procBonus) {
                procChance += offData.procBonus;
            }

            // 使い魔による確率補正
            if (attr === "火炎" && gameState.familiar === "ブレイズ") procChance = 0.15 + 0.05 * famLvl;
            if (attr === "潤流" && gameState.familiar === "ウェーブ") procChance = 0.15 + 0.05 * famLvl;
            if (attr === "刃嵐" && gameState.familiar === "ストーム") procChance = 0.15 + 0.05 * famLvl;
            if (attr === "轟雷" && gameState.familiar === "プラズマ") procChance = 0.15 + 0.05 * famLvl;
            if (attr === "暗黒" && gameState.familiar === "デーモン") procChance = 0.15 + 0.05 * famLvl;
            if (attr === "呪縛" && gameState.familiar === "オムニ") procChance = 0.15 + 0.05 * famLvl;

            // 通常攻撃、または槍・杖スキルの場合
            if (actionType === "normal" || gameState.mainHand.includes("槍") || gameState.mainHand.includes("杖")) {
                if (Math.random() < procChance) {
                    triggerAttributeEffect(attr, false);
                }
            }

            if (enemy.hp <= 0) {
                enemy.hp = 0;
                updateBattleHud();
                writeText(`\n✨ 【勝利】 属性効果の負荷に耐えきれず消滅した！`);
                endBattle(true);
            }
        }

        // 各種属性追加効果の制御
        function triggerAttributeEffect(attr, force = false) {
            const enemy = gameState.activeEnemy;
            if (!enemy) return;
            const famLvl = gameState.familiarLevels[gameState.familiar] || 1;

            if (attr === "火炎") {
                gameState.enemyStates.burn = 3;
                writeText(`🔥 【火炎効果】 敵の身体を激しい炎が包み込む！`);
            } else if (attr === "潤流") {
                let heal = 4 + 2 * famLvl; 
                const maxHp = getPlayerMaxHp();
                gameState.playerHp = Math.min(maxHp, gameState.playerHp + heal);
                writeText(`💧 【潤流効果】 命の水が溢れ、体力が ${heal} 回復した。`);
                updateBattleHud();
            } else if (attr === "刃嵐") {
                let extra = Math.floor(getPlayerTotalAtk() * (0.6 + 0.1 * famLvl));
                if (extra <= 0) extra = 1;
                enemy.hp -= extra;
                writeText(`🌀 【刃嵐効果】 吹き荒れる真空の刃が追加で ${extra} ダメージを刻む！`);
                updateBattleHud();
            } else if (attr === "岩石") {
                let duration = 2;
                if (gameState.familiar === "ロック") duration = 2 + famLvl;
                gameState.playerBuffs.rockDef = duration;
                writeText(`🪨 【岩石効果】 大地の加護により、自身の防御力が ${duration} ターン上昇！`);
            } else if (attr === "屍毒") {
                let duration = 2;
                if (gameState.familiar === "ロット") duration = 2 + famLvl;
                gameState.enemyStates.poison = duration;
                writeText(`☠️ 【屍毒効果】 禍々しい毒が敵の体を侵食し始めた！`);
            } else if (attr === "轟雷") {
                gameState.enemyStates.paralyze = 1;
                writeText(`⚡ 【轟雷効果】 稲妻が敵に直撃し、1ターン麻痺状態にした！`);
            } else if (attr === "神聖") {
                let bonus = 6;
                if (gameState.familiar === "ホーリー") bonus = 6 + 4 * famLvl;
                enemy.hp -= bonus;
                writeText(`✨ 【神聖効果】 聖なる光が闇を裂き、追加で ${bonus} の確定ダメージ！`);
                updateBattleHud();
            } else if (attr === "暗黒") {
                gameState.enemyStates.burn = 2; 
                writeText(`⬛ 【暗黒効果】 混沌たる闇の力が敵に状態異常をもたらした！`);
            } else if (attr === "呪縛") {
                gameState.curseCount++;
                let bonus = gameState.curseCount * 4;
                if (gameState.familiar === "オムニ") bonus += 2 * famLvl;
                enemy.hp -= bonus;
                writeText(`🔗 【呪縛効果】 因縁の鎖が締め付ける！(発動:${gameState.curseCount}回) 追加 ${bonus} ダメージ！`);
                updateBattleHud();
            }
        }

        // 敵の反撃ターン
        function enemyTurn() {
            const enemy = gameState.activeEnemy;
            if (!enemy || enemy.hp <= 0) return;

            if (gameState.enemyStates.burn > 0) {
                let burnDmg = 3;
                if (gameState.familiar === "ブレイズ") {
                    const lvl = gameState.familiarLevels["ブレイズ"] || 1;
                    burnDmg = 3 + 2 * lvl;
                }
                enemy.hp -= burnDmg;
                writeText(`🔥 炎上：${enemy.name}は激しい炎で ${burnDmg} ダメージを受けた。`);
                updateBattleHud();
                gameState.enemyStates.burn--;
            }
            if (gameState.enemyStates.poison > 0) {
                enemy.hp -= 2;
                writeText(`☠️ 毒：${enemy.name}は体内の毒により 2 ダメージを受けた。`);
                updateBattleHud();
                gameState.enemyStates.poison--;
            }

            if (enemy.hp <= 0) {
                enemy.hp = 0;
                updateBattleHud();
                writeText(`\n✨ 【勝利】 スリップダメージにより『${enemy.name}』が力尽きた！`);
                endBattle(true);
                return;
            }

            if (gameState.enemyStates.paralyze > 0) {
                writeText(`⚡ ${enemy.name}は全身が痺れて攻撃が行えない！`);
                gameState.enemyStates.paralyze = 0; 
                gameState.isDefending = false;

                tickCooldownsAndBuffs();
                setTimeout(enterBattleTurn, 800);
                return;
            }

            writeText(`\n👿 ${enemy.name}の反撃ターン！`);

            let baseEnemyAtk = enemy.atk;
            if (gameState.enemyStates.atkDown > 0) {
                baseEnemyAtk = Math.max(1, Math.floor(baseEnemyAtk * 0.85));
            }

            let edmg = baseEnemyAtk - getPlayerTotalDef();

            if (gameState.isDefending) {
                edmg = Math.floor(edmg / 2);
                gameState.isDefending = false; 
            }

            if (edmg <= 0) edmg = 1;

            gameState.playerHp -= edmg;
            writeText(`➔ 強烈な攻撃を浴び、${edmg} のダメージを受けた！`);
            updateBattleHud();

            tickCooldownsAndBuffs();

            if (gameState.playerHp <= 0) {
                gameState.playerHp = 0;
                updateBattleHud();
                writeText(`\n💀 【敗北】 ${gameState.playerName}の目の前が真っ暗になった...`);
                endBattle(false);
            } else {
                enterBattleTurn();
            }
        }

        // バフ・デバフ等のターン進行
        function tickCooldownsAndBuffs() {
            if (gameState.playerBuffs.rockDef > 0) gameState.playerBuffs.rockDef--;
            if (gameState.playerBuffs.swordAtkBuff > 0) gameState.playerBuffs.swordAtkBuff--;
            if (gameState.enemyStates.defDown > 0) gameState.enemyStates.defDown--;
            if (gameState.enemyStates.atkDown > 0) gameState.enemyStates.atkDown--;

            if (gameState.skillCooldown > 0) {
                gameState.skillCooldown--;
            }
        }

        // 戦闘終了時処理、ドロップ判定、レベルアップ
        function endBattle(isWin) {
            gameState.currentScene = "main";
            
            navTabs.classList.remove("hidden");
            tabContentArea.classList.remove("hidden");
            updateBattleHud();

            if (isWin && gameState.activeEnemy) {
                const enemy = gameState.activeEnemy;

                // 実績用：累計勝利数、武器種別勝利数
                gameState.statsWinCount = (gameState.statsWinCount || 0) + 1;
                checkAchievements("win");

                const wInfo = getDynamicItemStats(gameState.mainHand);
                const wType = wInfo ? wInfo.type : null;
                if (wType && wType in gameState.statsWinByWeaponType) {
                    gameState.statsWinByWeaponType[wType] = (gameState.statsWinByWeaponType[wType] || 0) + 1;
                    checkAchievements("weapon", wType);
                }
                
                // ボス討伐記録の更新
                if (enemy.isBoss) {
                    const firstKill = !gameState.bossesDefeated[enemy.name];
                    gameState.bossesDefeated[enemy.name] = true;
                    writeText(`\n🏆 【ボス討伐】エリアボス 『${enemy.name}』 を打ち倒した！`);

                    // 特殊強化石（+11~+15の合成に必要）：ボスを倒すたび1個ドロップ
                    gameState.specialEnhanceStones = (gameState.specialEnhanceStones || 0) + 1;
                    writeText(`💎 【強化石獲得】ボスの残滓から『特殊強化石』を1個手に入れた！（所持: ${gameState.specialEnhanceStones}個）`);

                    if (firstKill) checkAchievements("boss", enemy.name);
                }

                const expMult = getExpMultiplier();
                const goldMult = getGoldMultiplier();
                const expGained = Math.floor(enemy.exp * expMult);
                const goldGained = Math.floor(enemy.gold * goldMult);

                gameState.playerExp += expGained;
                gameState.playerGold += goldGained;

                writeText(`戦利品：\n ✦ 獲得経験値: +${fmtG(expGained)} (乗算補正: ${expMult.toFixed(2)}倍)\n ✦ 獲得ゴールド: +${fmtG(goldGained)} G (乗算補正: ${goldMult.toFixed(2)}倍)`);

                // エリア別ドロップ率取得
                const drInfo = AREA_DR_DB[gameState.selectedArea] || AREA_DR_DB["ヴェールタウン"];
                
                // 装備品ドロップ判定
                let dropRand = Math.random();
                // 🔮 貪欲の契約効果 (ドロップ率+15%)
                if (gameState.contracts && gameState.contracts.greedyCount > 0) {
                    dropRand -= 0.15;
                }

                let droppedRarity = 0;
                const rates = drInfo.rates;
                const sortedRarities = Object.keys(rates).map(Number).sort((a, b) => a - b);
                for (let r of sortedRarities) {
                    if (dropRand <= rates[r]) {
                        droppedRarity = r;
                        break;
                    }
                }

                if (droppedRarity > 0) {
                    const candidateNames = Object.keys(MASTER_DATABASE).filter(name => {
                        const data = MASTER_DATABASE[name];
                        return data.rarity === droppedRarity && data.category !== "talisman";
                    });

                    if (candidateNames.length > 0) {
                        const dropped = candidateNames[Math.floor(Math.random() * candidateNames.length)];
                        gameState.inventory.push(dropped);
                        writeText(`\n 🎉 【ドロップ】 光が収束する…『${dropped}』(☆${droppedRarity}) を獲得！`);
                    }
                }

                // タリスマンのドロップ判定
                const taliBaseChance = drInfo.taliRate || 0;
                let taliChance = taliBaseChance;
                // 貪欲の契約効果
                if (gameState.contracts && gameState.contracts.greedyCount > 0) {
                    taliChance += 0.01;
                }

                if (Math.random() < taliChance) {
                    const taliRand = Math.random() * 2500;
                    let selectedTali = "攻撃のタリスマン";
                    if (taliRand < 498) selectedTali = "攻撃のタリスマン";
                    else if (taliRand < 996) selectedTali = "物防のタリスマン";
                    else if (taliRand < 1494) selectedTali = "体力のタリスマン";
                    else if (taliRand < 1992) selectedTali = "畏怖のタリスマン";
                    else if (taliRand < 2490) selectedTali = "脅威のタリスマン";
                    else selectedTali = "神喰のタリスマン";

                    if (!gameState.talismanLevels[selectedTali]) {
                        gameState.talismanLevels[selectedTali] = 1;
                        gameState.inventory.push(selectedTali);
                        writeText(`\n 💀⚡ 【タリスマン発見！】 深淵の具現『${selectedTali}』(Lv.1) を発掘した！`);
                    } else {
                        gameState.talismanLevels[selectedTali]++;
                        writeText(`\n 💀⚡ 【タリスマン重鳴！】 既に所持していた秘宝『${selectedTali}』が共鳴し、Lv.${gameState.talismanLevels[selectedTali]} に昇華した！`);
                    }
                }

                // 倒した敵の属性と一致する欠片のドロップ判定
                if (enemy.attr && enemy.attr !== "無" && enemy.attr !== "物理" && enemy.attr !== "なし") {
                    const matChance = drInfo.matRate || 0.01;
                    if (Math.random() < matChance) {
                        const matName = `${enemy.attr}の欠片`;
                        if (matName in gameState.materials) {
                            gameState.materials[matName] = (gameState.materials[matName] || 0) + 1;
                            writeText(`✨ 【素材ドロップ】 敵の残滓から怪しくきらめく『${matName}』を1個獲得した！`);
                        }
                    }
                }

                // 🔮 ターン終了時の契約回数消費処理
                if (gameState.contracts) {
                    if (gameState.contracts.greedyCount > 0) {
                        gameState.contracts.greedyCount--;
                        if (gameState.contracts.greedyCount <= 0) {
                            writeText(`\n🔮【契約終了】『貪欲の契約』の効力が切れた。｢ヘッヘッへ…儲けたか…？｣`);
                        }
                    }
                    if (gameState.contracts.demonCount > 0) {
                        gameState.contracts.demonCount--;
                        if (gameState.contracts.demonCount <= 0) {
                            writeText(`\n🔮【契約終了】『鬼神の契約』の効力が切れた。｢ほとぼりも冷めるさ…いずれはな…｣`);
                        }
                    }
                    if (gameState.contracts.freezeCount > 0) {
                        gameState.contracts.freezeCount--;
                        if (gameState.contracts.freezeCount <= 0) {
                            writeText(`\n🔮【契約終了】『冷塞の契約』の効力が切れた。｢…おしまい…｣`);
                        }
                    }
                }

                // レベルアップの評価
                if (gameState.playerExp >= gameState.playerNextExp) {
                    gameState.playerLv++;
                    gameState.playerExp -= gameState.playerNextExp;
                    gameState.playerNextExp = Math.floor(gameState.playerNextExp * 1.5) + 10;
                    gameState.playerMaxHp += 4;
                    gameState.playerHp = getPlayerMaxHp(); 
                    gameState.baseAtk += 1;
                    gameState.baseDef += 1;
                    writeText(`\n🌟 ━━ LEVEL UP ━━ 🌟\n勇者の格が上がった！ レベル ${gameState.playerLv} に到達。\n最大HP+4、基本攻撃力+1、基本防御力+1。`);
                }

                // ★10武器コレクション実績（ドロップ・合成どちらでも増える可能性があるため、戦闘終了時にまとめて確認）
                checkAchievements("godWeapon");
            } else {
                const preGold = gameState.playerGold;
                gameState.playerGold = Math.max(0, Math.floor(gameState.playerGold / 2) - 20);
                gameState.playerHp = getPlayerMaxHp();

                if (gameState.contracts) {
                    gameState.contracts.greedyCount = 0;
                    gameState.contracts.demonCount = 0;
                    gameState.contracts.freezeCount = 0;
                }
                gameState.playerBuffs.swordAtkBuff = 0;
                gameState.playerBuffs.drainBoltCount = 0;

                gameState.isOpeningActive = true;
                clearText();
                enqueueText(`\n🏥【復活】ヴェールタウンの救護所で目を覚ました。`, () => {
                    enqueueText(`➔ 所持金が ${fmtG(preGold)}G から ${fmtG(gameState.playerGold)}G へ減少した。契約バフも消え去った。`, () => {
                        gameState.isOpeningActive = false;
                        switchTab("home");
                    });
                });
            }

            gameState.activeEnemy = null;
            saveGame();
            switchTab("home");
        }


</script>
    <script>
        // --- ゲーム開始・名前入力フロー ---
        function submitName() {
            const input = playerNameInput.value.trim();
            if (!input) {
                alert("勇者の名前を入力してください。");
                return;
            }
            gameState.playerName = input;
            gameState.currentScene = "main";
            nameForm.classList.add("hidden");
            navTabs.classList.remove("hidden");

            generateBlackMarketProducts();
            clearText();

            enqueueText(`――かつて栄華を誇った都市｢ナルドプ｣は、突如現れた悪魔の軍勢により漆黒の闇に包まれた。`);
            enqueueText(`栄えていた時代とはかけ離れた、荒んだ景色が広がっていた。`);
            enqueueText(`僕が目を覚ました場所は、はじまりのエリア「ヴェールタウン」。`);
            enqueueText(`故郷からかけ離れたこの場所で、物語は幕を開ける。`);
            enqueueText(`「……僕は、屈しない」`);
            enqueueText(`名前は ${gameState.playerName}。失われた世界の光を取り戻すため、勇者は今、最初の一歩を踏み出す。`, () => {
                gameState.isOpeningActive = false;
                switchTab("home");
            });
        }

        // 初期化処理
        function initGame() {
            clearText();
            tabContentArea.classList.add("hidden");
            navTabs.classList.add("hidden");
            nameForm.classList.add("hidden");
            battleHud.classList.add("hidden");
            
            let savedData = localStorage.getItem("darkTownSave");
            
            if (savedData) {
                try {
                    const parsed = JSON.parse(savedData);
                    
                    if (!parsed.playerName) {
                        localStorage.removeItem("darkTownSave");
                        savedData = null;
                        throw new Error("名前なしセーブデータ");
                    }
                    Object.assign(gameState, JSON.parse(JSON.stringify(DEFAULT_GAME_STATE)), parsed);

                    if (!gameState.materials) gameState.materials = {};
                    for (const mat of MATERIAL_NAMES) {
                        if (!(mat in gameState.materials)) gameState.materials[mat] = 0;
                    }
                    if (!gameState.familiarLevels) gameState.familiarLevels = {};
                    if (!gameState.talismanLevels) gameState.talismanLevels = {};
                    if (!gameState.familiarsUnlocked) gameState.familiarsUnlocked = [];
                    if (!gameState.playerBuffs) {
                        gameState.playerBuffs = { rockDef: 0, swordAtkBuff: 0, drainBoltCount: 0 };
                    }

                    if (!gameState.specialEnhanceStones) gameState.specialEnhanceStones = 0;
                    if (!gameState.statsExploreCount) gameState.statsExploreCount = 0;
                    if (!gameState.statsWinCount) gameState.statsWinCount = 0;
                    if (!gameState.statsWinByWeaponType) {
                        gameState.statsWinByWeaponType = JSON.parse(JSON.stringify(DEFAULT_GAME_STATE.statsWinByWeaponType));
                    } else {
                        for (const wType of Object.keys(DEFAULT_GAME_STATE.statsWinByWeaponType)) {
                            if (!(wType in gameState.statsWinByWeaponType)) gameState.statsWinByWeaponType[wType] = 0;
                        }
                    }
                    if (!gameState.achievementsUnlocked) gameState.achievementsUnlocked = [];

                    if (!gameState.contracts) {
                        gameState.contracts = JSON.parse(JSON.stringify(DEFAULT_GAME_STATE.contracts));
                    } else {
                        if (gameState.contracts.expLevel === undefined) gameState.contracts.expLevel = 0;
                        if (gameState.contracts.goldLevel === undefined) gameState.contracts.goldLevel = 0;
                        if (gameState.contracts.greedyCount === undefined) gameState.contracts.greedyCount = 0;
                        if (gameState.contracts.demonCount === undefined) gameState.contracts.demonCount = 0;
                        if (gameState.contracts.freezeCount === undefined) gameState.contracts.freezeCount = 0;
                    }

                    gameState.familiarsUnlocked.forEach(fam => {
                        if (!gameState.familiarLevels[fam]) {
                            gameState.familiarLevels[fam] = 1;
                        }
                    });

                    if (gameState.blackMarketProducts) {
                        gameState.blackMarketProducts = gameState.blackMarketProducts.map(p => {
                            if (typeof p === "string") {
                                return { name: p, sold: false };
                            }
                            return p;
                        });
                    } else {
                        generateBlackMarketProducts();
                    }

                    gameState.currentScene = "main";
                    gameState.activeEnemy = null;
                    gameState.isOpeningActive = false;
                    nameForm.classList.add("hidden");
                    tabContentArea.classList.remove("hidden");
                    navTabs.classList.remove("hidden");
                    
                    // 先にホームへ戻す（セーブ時のタブが残っていると、ログが通知として出てしまうため）
                    gameState.currentTab = "home";
                    syncTabAttr();
                    writeText(`おかえりなさい、勇者 ${gameState.playerName}。`);
                    switchTab("home");
                    return;
                } catch(e) {
                    console.error("セーブデータの読み込みに失敗しました。リセットします。", e);
                    localStorage.removeItem("darkTownSave");
                }
            }

            Object.assign(gameState, JSON.parse(JSON.stringify(DEFAULT_GAME_STATE)));
            syncTabAttr();

            gameState.isOpeningActive = true;
            enqueueText("暗い街が霧の中に佇んでいる。");
            enqueueText(" ");
            enqueueText("…");
            enqueueText(" ");
            enqueueText("囁く声が聞こえる…");
            enqueueText(" ");
            enqueueText("助けを求める声が聞こえる…");
            enqueueText(" ");
            enqueueText("…気がする…");
            enqueueText(" ");
            enqueueText("…");
            enqueueText(" ");
            enqueueText("…あなたの名前は？", () => {
                nameForm.classList.remove("hidden");
            });
        }

window.onload = initGame;

</script>
</body>
</html>
