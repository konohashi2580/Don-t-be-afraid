<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恐るるは闇、僕は勇者</title>
    <style>
    /* --- 基本テーマ設定 (黒・赤ベースのダークファンタジー) --- */
    :root {
        --bg-color: #0a0a0c;
        --panel-color: #141419;
        --border-color: #3a0808;
        --text-color: #d1c7bd;
        --accent-color: #8a1515;
        --accent-hover: #b31c1c;
        --font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: var(--font-family);
        line-height: 1.6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 10px;
    }

    /* --- メインコンテナ --- */
    .game-container {
        width: 100%;
        max-width: 650px;
        height: 94vh;
        background-color: var(--panel-color);
        border: 2px solid var(--border-color);
        border-radius: 4px;
        box-shadow: 0 0 20px rgba(138, 21, 21, 0.2);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* --- ヘッダー領域 --- */
    .game-header {
        background-color: #000;
        padding: 12px;
        text-align: center;
        border-bottom: 2px solid var(--border-color);
    }

    .game-title {
        font-size: 1.2rem;
        color: var(--accent-color);
        letter-spacing: 2px;
        text-shadow: 0 0 5px rgba(138, 21, 21, 0.6);
    }

    /* --- 戦闘HUD --- */
    .battle-hud {
        background-color: #110303;
        border-bottom: 2px solid var(--border-color);
        padding: 12px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .hud-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        gap: 10px;
    }

    .hud-label {
        font-weight: bold;
        flex-shrink: 0;
        min-width: 110px;
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
    }

    .hud-hp-wrapper {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .hud-hp-container {
        flex: 1;
        background-color: #222;
        height: 10px;
        border-radius: 5px;
        overflow: hidden;
        border: 1px solid #444;
        position: relative;
    }

    .hud-hp-bar {
        height: 100%;
        width: 100%;
        transition: width 0.3s ease;
    }

    .player-hp-bar {
        background-color: #a61c1c; /* 勇者の赤 */
        box-shadow: 0 0 5px rgba(166, 28, 28, 0.8);
    }

    .enemy-hp-bar {
        background-color: #632da6; /* 敵の禍々しい紫 */
        box-shadow: 0 0 5px rgba(99, 45, 166, 0.8);
    }

    .hud-hp-text {
        font-family: monospace;
        font-size: 0.8rem;
        color: #fff;
        min-width: 75px;
        text-align: right;
        flex-shrink: 0;
    }

    /* --- テキスト（ログ）表示エリア --- */
    .text-area {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        background-color: rgba(0, 0, 0, 0.5);
        border-bottom: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }

    .log-text {
        margin-bottom: 8px;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 0.95rem;
        animation: fadeIn 0.2s ease-in-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* --- メインコンテンツ・タブ切替領域 --- */
    .tab-content {
        padding: 15px;
        background-color: #0d0d11;
        border-bottom: 1px solid var(--border-color);
        min-height: 200px;
        max-height: 280px;
        overflow-y: auto;
    }

    /* ステータス表示のグリッド */
    .status-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 5px 15px;
        font-size: 0.85rem;
    }

    .status-item {
        border-bottom: 1px dashed #333;
        padding: 2px 0;
    }

    /* インベントリ・リスト用スタイル */
    .inventory-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .inventory-item {
        background: #1a1a22;
        border: 1px solid #333;
        padding: 6px 10px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        transition: all 0.2s ease;
    }

    .item-info {
        flex: 1;
    }

    .eq-btn {
        background: #3a0808;
        color: #fff;
        border: 1px solid #8a1515;
        padding: 4px 10px;
        font-size: 0.75rem;
        cursor: pointer;
        border-radius: 3px;
    }
    .eq-btn:hover {
        background: #8a1515;
    }

    .eq-btn:disabled {
        background: #111 !important;
        border-color: #333 !important;
        color: #555 !important;
        cursor: not-allowed;
        opacity: 0.4;
    }

    .sub-tab-container {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
    }

    .sub-tab-btn {
        flex: 1;
        background: #111;
        border: 1px solid #444;
        color: #aaa;
        padding: 5px;
        font-size: 0.8rem;
        cursor: pointer;
        text-align: center;
    }
    .sub-tab-btn.active {
        background: #2a0505;
        border-color: #8a1515;
        color: #fff;
    }

    /* --- 入力・コントロールフォーム領域 --- */
    .input-area {
        padding: 15px;
        background-color: #0d0d11;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: center;
        gap: 10px;
    }

    .hidden {
        display: none !important;
    }

    input[type="text"] {
        background-color: #000;
        border: 1px solid var(--border-color);
        color: var(--text-color);
        padding: 8px 12px;
        font-size: 1rem;
        border-radius: 4px;
        width: 60%;
        outline: none;
    }

    /* --- ボタン選択肢エリア --- */
    .action-area {
        padding: 12px;
        background-color: #0a0a0d;
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        min-height: 80px;
    }

    /* エリア選択用の左右分割レイアウト用CSS */
    .action-split {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 12px;
        width: 100%;
        align-items: center;
    }

    .styled-select {
        width: 100%;
        background-color: #141419;
        color: #d1c7bd;
        border: 1px solid var(--border-color);
        padding: 6px 10px;
        font-size: 0.8rem;
        border-radius: 4px;
        outline: none;
        cursor: pointer;
        font-family: var(--font-family);
    }
    .styled-select:focus {
        border-color: var(--accent-color);
    }

    /* --- ナビゲーションタブバー ---
       各ボタンが独立した角丸カードに見えるよう、隙間を空けて並べる */
    .nav-tabs {
        display: flex;
        gap: 6px;
        background-color: #000;
        border-top: 1px solid var(--border-color);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    }

    .tab-btn {
        flex: 1;
        background-color: #14141a;
        border: 1px solid #2a2a33;
        border-radius: 10px;
        color: #888;
        padding: 10px 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
    }

    .tab-btn.active {
        color: #fff;
        background-color: var(--accent-color);
        border-color: #ff5555;
        font-weight: bold;
    }

    .btn {
        background-color: #1a1a22;
        color: var(--text-color);
        border: 1px solid var(--border-color);
        padding: 10px;
        font-size: 0.95rem;
        cursor: pointer;
        border-radius: 4px;
        transition: all 0.2s ease;
        text-align: center;
        user-select: none;
    }

    .btn:hover {
        background-color: var(--accent-color);
        color: #fff;
        border-color: #ff3333;
        box-shadow: 0 0 8px rgba(255, 51, 51, 0.3);
    }

    .btn:disabled {
        background-color: #111;
        color: #444;
        border-color: #222;
        cursor: not-allowed;
        box-shadow: none !important;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 5px rgba(255, 51, 51, 0.4); }
        50% { box-shadow: 0 0 15px rgba(255, 51, 51, 0.8); }
        100% { box-shadow: 0 0 5px rgba(255, 51, 51, 0.4); }
    }

    /* =====================================================
       ▼▼ UI強化パック（ボタン立体化・安定化・トランジション） ▼▼
       ここから下を削除すれば、元の見た目に戻ります。
       ===================================================== */

    :root {
        --btn-radius: 6px;
        --btn-height: 44px;          /* スマホで押しやすい最小の高さ */
        --press-depth: 3px;          /* ボタンの厚み(影の高さ) */
        --transition-fast: 0.12s;
    }

    /* タップ時の青い枠・拡大を防ぐ */
    button, select {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    /* ---------- 共通：立体ボタン ----------
       色(background / border-color)は既存のインライン指定がそのまま効く。
       立体感は「背景に重ねる光」と「影」だけで作るので、色分けを邪魔しない。 */
    .btn, .eq-btn, .sub-tab-btn {
        position: relative;
        font-family: var(--font-family);
        border-radius: var(--btn-radius);
        background-image: linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.14) 0%,
            rgba(255, 255, 255, 0.03) 45%,
            rgba(0, 0, 0, 0.22) 100%
        );
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.18),      /* 上端のハイライト */
            0 var(--press-depth) 0 rgba(0, 0, 0, 0.65),    /* 厚み */
            0 calc(var(--press-depth) + 2px) 6px rgba(0, 0, 0, 0.5);
        transform: translateY(0);
        transition:
            transform var(--transition-fast) ease,
            box-shadow var(--transition-fast) ease,
            filter var(--transition-fast) ease,
            background-color 0.2s ease;
        user-select: none;
        -webkit-user-select: none;
    }

    /* 押した時：沈む */
    .btn:active:not(:disabled),
    .eq-btn:active:not(:disabled),
    .sub-tab-btn:active {
        transform: translateY(var(--press-depth));
        box-shadow:
            inset 0 2px 4px rgba(0, 0, 0, 0.55),
            0 0 0 rgba(0, 0, 0, 0);
        filter: brightness(0.9);
    }

    /* PCのホバー：明るくするだけ(スマホで残り続けるのを防ぐため hover対応端末のみ) */
    @media (hover: hover) {
        .btn:hover:not(:disabled),
        .eq-btn:hover:not(:disabled) {
            filter: brightness(1.18);
        }
        .sub-tab-btn:hover { filter: brightness(1.2); }
    }

    /* キーボード操作時のフォーカス表示 */
    .btn:focus-visible, .eq-btn:focus-visible,
    .sub-tab-btn:focus-visible, .tab-btn:focus-visible,
    .styled-select:focus-visible {
        outline: 2px solid #ff6b6b;
        outline-offset: 2px;
    }

    /* 押せない時：立体感を消してへこんだ状態に */
    .btn:disabled, .eq-btn:disabled {
        background-image: none !important;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7) !important;
        transform: none !important;
        filter: grayscale(0.6);
    }

    /* ---------- メインボタン(.btn) ---------- */
    .btn {
        min-height: var(--btn-height);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-weight: bold;
        letter-spacing: 0.5px;
        line-height: 1.3;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
    /* .btn の旧hoverの赤い発光は、立体ボタンと二重になるので打ち消す */
    .btn:hover:not(:disabled) {
        background-color: var(--accent-hover);
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.22),
            0 var(--press-depth) 0 rgba(0, 0, 0, 0.65),
            0 calc(var(--press-depth) + 2px) 10px rgba(255, 51, 51, 0.25);
    }
    .btn:active:not(:disabled) {
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.55), 0 0 0 rgba(0, 0, 0, 0);
    }

    /* ---------- 装備リスト等の小ボタン(.eq-btn) ---------- */
    .eq-btn {
        min-height: 34px;
        min-width: 56px;
        padding: 4px 12px;
        font-weight: bold;
        white-space: nowrap;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        --press-depth: 2px;
    }

    /* ---------- サブタブ(.sub-tab-btn) ---------- */
    .sub-tab-container {
        flex-wrap: wrap;
        gap: 6px;
    }
    .sub-tab-btn {
        min-height: 36px;
        border-radius: var(--btn-radius);
        --press-depth: 2px;
    }
    /* 選択中のタブは「押し込まれたまま」に見せる */
    .sub-tab-btn.active {
        transform: translateY(var(--press-depth));
        box-shadow:
            inset 0 2px 5px rgba(0, 0, 0, 0.6),
            0 0 8px rgba(138, 21, 21, 0.45);
        font-weight: bold;
    }

    /* ---------- 下タブバー(.tab-btn)：独立した角丸ボタンとして立体化 ---------- */
    .nav-tabs {
        background: linear-gradient(to bottom, #050505, #000);
        border-top: 2px solid var(--border-color);
    }
    .tab-btn {
        min-height: 50px;
        position: relative;
        background-image: linear-gradient(
            to bottom,
            rgba(255, 255, 255, 0.10) 0%,
            rgba(255, 255, 255, 0.02) 45%,
            rgba(0, 0, 0, 0.25) 100%
        );
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.10),
            0 2px 0 rgba(0, 0, 0, 0.6),
            0 4px 5px rgba(0, 0, 0, 0.4);
        transform: translateY(0);
        transition: color 0.2s, background-color 0.2s, box-shadow 0.2s, transform 0.12s ease, filter 0.12s ease;
    }
    .tab-btn:active {
        transform: translateY(2px);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        filter: brightness(0.92);
    }
    @media (hover: hover) {
        .tab-btn:hover { filter: brightness(1.15); }
    }
    .tab-btn.active {
        box-shadow:
            inset 0 1px 0 rgba(255, 255, 255, 0.25),
            0 2px 0 rgba(0, 0, 0, 0.6),
            0 4px 10px rgba(255, 51, 51, 0.3);
    }
    .tab-btn.active:active {
        transform: translateY(2px);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    /* ---------- セレクトボックス ---------- */
    .styled-select {
        min-height: 40px;
        padding: 8px 10px;
        border-radius: var(--btn-radius);
        background-image: linear-gradient(to bottom, rgba(255,255,255,0.06), rgba(0,0,0,0.2));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 2px 0 rgba(0,0,0,0.5);
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .styled-select:focus {
        box-shadow: 0 0 0 2px rgba(138, 21, 21, 0.5), 0 2px 0 rgba(0,0,0,0.5);
    }

    /* ---------- 名前入力 ---------- */
    input[type="text"] {
        min-height: 40px;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7);
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
        border-color: var(--accent-color);
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.7), 0 0 6px rgba(138, 21, 21, 0.5);
    }

    /* =====================================================
       UIの安定化（レイアウトが跳ねる・切れる問題の対処）
       ===================================================== */

    /* 画面の高さ：スマホのアドレスバーで100vhがズレる問題を dvh で回避 */
    body { min-height: 100vh; min-height: 100dvh; align-items: center; }
    /* 元の「94vh」と同じ考え方。dvh対応ブラウザでは、アドレスバーを含めた実際の高さに合わせる */
    .game-container { height: 94vh; height: 94dvh; min-height: 0; }

    /* 上のログ欄は縮められるように、下の操作パネルは縮まないように固定 */
    .text-area { min-height: 90px; overscroll-behavior: contain; }
    .tab-content, .action-area, .nav-tabs, .input-area, .battle-hud, .game-header {
        flex-shrink: 0;
    }

    /* ステータス欄：高さを固定して、中身が増えてもパネルが跳ねないようにする。
       最下行が見切れて見える件は、下に余白を足して「まだ続く」ことを分かりやすくする */
    .tab-content {
        height: 280px;
        max-height: 280px;
        min-height: 280px;
        overscroll-behavior: contain;
        scrollbar-width: thin;
        scrollbar-color: #5a1010 #0d0d11;
        padding-bottom: 28px;
        /* 下端に薄いフェードを出し、続きがあることを示す */
        -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent 100%);
                mask-image: linear-gradient(to bottom, #000 calc(100% - 22px), transparent 100%);
    }
    .tab-content::-webkit-scrollbar { width: 6px; }
    .tab-content::-webkit-scrollbar-thumb { background: #5a1010; border-radius: 3px; }

    /* 操作エリア：高さを固定して、戦闘/通常/選択肢の数が変わっても揺れないようにする */
    .action-area {
        min-height: 112px;
        align-content: start;
        border-top: 1px solid var(--border-color);
        background: linear-gradient(to bottom, #0c0c10, #08080a);
    }

    /* 装備リスト：ボタンが押しやすく、改行で崩れないように */
    .inventory-item { gap: 8px; padding: 8px 10px; }
    .inventory-item .item-info { min-width: 0; word-break: break-word; }

    /* 狭い画面(360px前後)向け */
    @media (max-width: 400px) {
        .btn { font-size: 0.88rem; padding: 8px 6px; }
        .action-split { gap: 8px; }
        .tab-btn { font-size: 0.78rem; }
    }

    /* =====================================================
       エリア切り替えトランジション
       ===================================================== */

    /* 暗転用のオーバーレイ(ゲーム画面の中だけを覆う) */
    .game-container { position: relative; }

    .area-transition {
        position: absolute;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        pointer-events: none;
        opacity: 0;
        background:
            radial-gradient(ellipse at center, rgba(40, 0, 0, 0.55) 0%, rgba(0, 0, 0, 0.96) 75%),
            #000;
    }
    .area-transition.is-active {
        pointer-events: auto;      /* 暗転中は誤タップを防ぐ */
    }
    /* 時間は ui.js の AREA_FADE_IN_MS / AREA_FADE_OUT_MS から流し込まれる（既定値は保険） */
    .area-transition.fade-in  { animation: areaFadeIn  var(--area-fade-in, 350ms)  ease-out forwards; }
    .area-transition.fade-out { animation: areaFadeOut var(--area-fade-out, 350ms) ease-in  forwards; }

    @keyframes areaFadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes areaFadeOut { from { opacity: 1; } to { opacity: 0; } }

    .area-transition-name {
        font-size: 1.5rem;
        font-weight: bold;
        letter-spacing: 6px;
        color: #c92a2a;
        text-shadow: 0 0 12px rgba(201, 42, 42, 0.75), 0 0 2px #000;
        opacity: 0;
        transform: translateY(6px);
    }
    .area-transition-sub {
        font-size: 0.9rem;
        letter-spacing: 3px;
        color: #a89e94;
        opacity: 0;
        transform: translateY(6px);
    }
    .area-transition.fade-in .area-transition-name { animation: areaTextIn 0.4s 0.10s ease-out forwards; }
    .area-transition.fade-in .area-transition-sub  { animation: areaTextIn 0.4s 0.20s ease-out forwards; }
    .area-transition.fade-out .area-transition-name,
    .area-transition.fade-out .area-transition-sub { opacity: 1; transform: none; }

    @keyframes areaTextIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* 暗転が明ける時に、下の操作パネルがふわっと現れる */
    .panel-reveal { animation: panelReveal 0.45s ease-out both; }
    @keyframes panelReveal {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* 「動きを減らす」設定の端末では、アニメーションを最小限にする */
    @media (prefers-reduced-motion: reduce) {
        .btn, .eq-btn, .sub-tab-btn, .tab-btn { transition: none; }
        .area-transition.fade-in, .area-transition.fade-out { animation-duration: 0.01s; }
        .area-transition-name, .area-transition-sub { animation: none !important; opacity: 1; transform: none; }
        .panel-reveal { animation: none; }
    }

    /* ---------- 微調整（スマホ実機での見切れ対策） ---------- */

    /* サブタブ：全部を1行に均等割りで並べる（横スクロールにしない）。
       文字は折り返さず、狭い時は文字サイズと左右余白を詰めて収める */
    .sub-tab-container {
        flex-wrap: nowrap;
        overflow: visible;
        gap: 5px;
        padding: 2px 0 6px;
    }
    .sub-tab-btn {
        flex: 1 1 0 !important;       /* 既存のインライン flex:1 と同じ意味。均等幅 */
        min-width: 0 !important;
        white-space: nowrap;
        padding: 4px 2px !important;
        font-size: 0.74rem !important;
        overflow: hidden;
        text-overflow: clip;
    }
    /* 「オフハンド 🔮」のように長い文字は、この幅だと収まらないため、
       ボタンの中身を「文字が長い時だけ少し小さく」する */
    .sub-tab-btn { letter-spacing: -0.3px; }
    @media (max-width: 380px) {
        .sub-tab-btn { font-size: 0.68rem !important; letter-spacing: -0.5px; }
    }

    /* 下タブ：文字が右端で詰まらないように */
    .tab-btn { padding: 10px 2px; font-size: 0.78rem; white-space: nowrap; }

    /* 操作エリアが空の時(装備タブ等)は、高さを取らない */
    .action-area:empty { min-height: 0 !important; padding: 0; border-top: none; }

    /* 探索エリアの選択：文字が長い時は、省略せず読める大きさに */
    .styled-select { font-size: 0.78rem; padding-right: 4px; text-overflow: ellipsis; }
    .action-split { grid-template-columns: 1.25fr 0.75fr; }

    /* ---------- 確認ダイアログ(リセット・転生)のボタンも立体化 ---------- */
    #resetCancelBtn, #resetConfirmBtn, #reincCancelBtn, #reincConfirmBtn {
        min-height: var(--btn-height);
        font-family: var(--font-family);
        line-height: 1.3;
        background-image: linear-gradient(to bottom, rgba(255,255,255,0.14), rgba(255,255,255,0.03) 45%, rgba(0,0,0,0.22));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 3px 0 rgba(0,0,0,0.65), 0 5px 6px rgba(0,0,0,0.5);
        transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
        -webkit-tap-highlight-color: transparent;
    }
    #resetCancelBtn:active, #resetConfirmBtn:active,
    #reincCancelBtn:active, #reincConfirmBtn:active {
        transform: translateY(3px);
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.55);
        filter: brightness(0.9);
    }

    /* =====================================================
       ホーム以外のタブ：ログ欄を隠し、通知(トースト)で知らせる
       ===================================================== */

    /* 装備・闇市・契約・メニューでは、ログ欄を隠して内容を広く使う。
       ログ自体は消えていない（ホームに戻ると読める）。戦闘中は従来どおり表示。 */
    .game-container:not([data-tab="home"]) .text-area { display: none; }

    /* 空いた高さは、タブの内容が使う */
    .game-container:not([data-tab="home"]) .tab-content {
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
        max-height: none;
        padding-top: 18px;
    }

    /* ---------- プッシュ通知風トースト ---------- */
    .toast-container {
        position: absolute;
        top: 6px;
        left: 8px;
        right: 8px;
        z-index: 40;                 /* 暗転(50)より下、通常UIより上 */
        display: flex;
        flex-direction: column;
        gap: 5px;
        pointer-events: none;        /* 通知の外側は操作を邪魔しない */
        padding-top: env(safe-area-inset-top, 0px);
    }
    .toast {
        pointer-events: auto;
        display: block;
        padding: 8px 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.10);
        border-left: 4px solid var(--accent-hover);
        background: linear-gradient(to bottom, rgba(34, 22, 24, 0.97), rgba(18, 12, 14, 0.97));
        color: #f1e9e2;
        font-size: 0.8rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        cursor: pointer;
        animation: toastIn 0.32s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
    }
    .toast-error {
        border-left-color: #ffb020;
        background: linear-gradient(to bottom, rgba(50, 30, 12, 0.97), rgba(28, 16, 8, 0.97));
    }
    .toast.leaving { animation: toastOut 0.3s ease-in both; }

    @keyframes toastIn {
        from { opacity: 0; transform: translateY(-140%) scale(0.98); }
        to   { opacity: 1; transform: translateY(0)     scale(1); }
    }
    @keyframes toastOut {
        from { opacity: 1; transform: translateY(0); }
        to   { opacity: 0; transform: translateY(-120%); }
    }

    @media (prefers-reduced-motion: reduce) {
        .toast, .toast.leaving { animation-duration: 0.01s; }
    }

    /* ---------- 売却ボタンの2段階確認 ---------- */
    .sell-btn.confirming {
        background: #ffb020 !important;
        border-color: #ffd166 !important;
        color: #1a1200 !important;
        font-weight: bold;
        animation: sellPulse 0.9s ease-in-out infinite;
    }
    @keyframes sellPulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
        .sell-btn.confirming { animation: none; }
    }

    /* =====================================================
       装備・使い魔・契約：グリッド(カード)表示
       アイコンは仮の絵文字。本番の絵に差し替える時は
       .item-card-icon の中身（絵文字1文字）を <img> に置き換えればよい。
       ===================================================== */

    .item-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
    }

    .item-card {
        background: #1a1a22;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        transition: all 0.2s ease;
        min-width: 0;               /* グリッド内で文字がはみ出さないように */
    }
    .item-card.is-equipped {
        border-color: #2da654;
        background-color: #111a13;
    }
    .item-card.is-highlight {
        border-color: #8a1515;      /* 合成候補・契約中など、注目させたいカード */
    }

    .item-card-icon {
        width: 100%;
        aspect-ratio: 1.3 / 1;      /* 将来、画像に差し替えた時にレイアウトが崩れないよう比率を固定 */
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.9rem;
        background: radial-gradient(ellipse at center, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
        border-radius: 6px;
        border: 1px solid #2a2a33;
        line-height: 1;
    }

    .item-card-name {
        font-size: 0.76rem;
        font-weight: bold;
        line-height: 1.25;
        word-break: break-word;
        min-height: 1.9em;         /* 1行・2行どちらでもボタン位置が揃うように */
        display: flex;
        align-items: center;
    }

    .item-card-badge {
        align-self: flex-start;
        background-color: #1a4d1a;
        color: #3dfc7d;
        border: 1px solid #2da654;
        padding: 1px 6px;
        font-size: 0.68rem;
        border-radius: 3px;
        font-weight: bold;
    }
    .item-card-badge.badge-muted { background: #262630; color: #888; border-color: #3a3a45; }
    .item-card-badge.badge-accent { background: #3a1a4d; color: #d199ff; border-color: #7d3ea6; }

    .item-card-info {
        font-size: 0.66rem;
        color: #aaa;
        line-height: 1.35;
        flex: 1;                   /* 情報量が違っても、ボタンをカード下端に揃える */
    }

    .item-card-actions {
        display: flex;
        flex-direction: column;   /* 3列だと横並びは狭すぎるため、縦積みにする */
        gap: 4px;
    }
    .item-card-actions .eq-btn {
        width: 100%;
        min-width: 0;
        padding: 6px 4px;
        font-size: 0.72rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* 画面が狭い時は1カードあたりの絵文字を少し小さく */
    @media (max-width: 380px) {
        .item-card-icon { font-size: 1.8rem; }
        .item-card-name { font-size: 0.78rem; }
    }

        </div>

        <div class="action-area" id="actionArea"></div>

        <nav class="nav-tabs hidden" id="navTabs">
            <button class="tab-btn active" id="tab-home" onclick="switchTab('home')">ホーム</button>

            <button class="tab-btn" id="tab-menu" onclick="switchTab('menu')">メニュー</button>
        </nav>
    </div>

    <script>
        // --- 数値の桁区切り表示（ゴールドなど大きい数字を読みやすくする） ---

            const num = Math.trunc(Number(n) || 0);
            return num.toLocaleString("ja-JP");
        }

        const ELEMENT_ICONS = {

        const CATEGORY_ICONS = {

        // 契約ごとのアイコン
        const CONTRACT_ICONS = {
            exp: "📖", gold: "💰", greedy: "🐍", demon: "👹", freeze: "❄️",

        // アイテム名(表示名)から、装備一覧カードに出す絵文字アイコンを1つ決める
        function getItemIcon(itemName) {
            const item = getDynamicItemStats(itemName);
            if (!item) return "❔";
            if (item.category === "weapon") {
                return WEAPON_TYPE_ICONS[item.type] || ELEMENT_ICONS[item.attr] || "🗡️";

        const ACHIEVEMENT_DEFS = [];

        [10, 100, 10000, 1000000, 100000000].forEach((n, i) => {
            const titles = ["駆け出しの一歩", "慣れた足取り", "歴戦の旅路", "果てなき彷徨", "世界を踏破せし者"];
            ACHIEVEMENT_DEFS.push({
                id: `explore_${n}`, category: "explore", threshold: n,

    <script>
        // --- デフォルトのゲームステート定義 ---
        const DEFAULT_GAME_STATE = {

            playerLv: 1,

            playerMaxHp: 30,

                "物理の欠片": 0, "火炎の欠片": 0, "潤流の欠片": 0, "刃嵐の欠片": 0, "岩石の欠片": 0,
                "屍毒の欠片": 0, "轟雷の欠片": 0, "神聖の欠片": 0, "暗黒の欠片": 0, "呪縛の欠片": 0
            },
            familiarsUnlocked: [], // 錬成済みの使い魔
            familiarLevels: {}, // 各使い魔のレベル管理
            talismanLevels: {}, // 各タリスマンのレベル管理
            specialEnhanceStones: 0, // 特殊強化石（+11~+15の合成に必要。ボス撃破でのみ入手）

            // --- 実績トラッキング用カウンタ ---
            statsExploreCount: 0,  // 累計探索回数
            statsWinCount: 0,      // 累計戦闘勝利数
            statsWinByWeaponType: { // 武器種別ごとの勝利数
                "剣": 0, "短剣": 0, "杖": 0, "大剣": 0, "槍": 0,
                "斧": 0, "大槌": 0, "弓": 0, "双剣": 0
            },
            achievementsUnlocked: [], // 解除済み実績ID一覧（表示・再通知防止用）

            // 契約システム管理用オブジェクト
            contracts: {
                expLevel: 0,      // 経験の契約 (最大20)
                goldLevel: 0,     // 金錬の契約 (最大20)
                greedyCount: 0,   // 貪欲の契約の有効残り戦闘回数
                demonCount: 0,    // 鬼神の契約の有効残り戦闘回数
                freezeCount: 0    // 冷塞の契約の有効残り戦闘回数
            },

            currentScene: "title",
            currentTab: "home",
            prepSubTab: "equip", // "equip" | "material" | "familiar" | "synthesize"
            menuSubTab: "settings", // "settings" | "achievements"
            equipCategoryFilter: "all", // "all" | "weapon" | "armor" | "accessory" | "offhand"
            blackMarketProducts: [], // 闇市の商品
            actionsUntilRefresh: 10,
            activeEnemy: null,
            isDefending: false,
            playerBuffs: { 
                rockDef: 0,
                swordAtkBuff: 0,
                drainBoltCount: 0
            },
            enemyStates: { 
                burn: 0, 
                poison: 0, 
                paralyze: 0,
                defDown: 0,
                atkDown: 0
            },
            curseCount: 0,
            isOpeningActive: false,
            skillCooldown: 0,
            skillSelected: false
        };

        // 状態オブジェクトのインスタンス化
        let gameState = JSON.parse(JSON.stringify(DEFAULT_GAME_STATE));

        // --- 強化ステータス倍率計算用ヘルパー ---
        function getEnhancementMultiplier(plusLevel) {
            return Math.pow(1.2, plusLevel || 0);
        }

        // アイテム名と強化値を取得するヘルパー
        function parseItemName(fullItemName) {
            if (!fullItemName) return { baseName: "なし", plus: 0 };
            const match = fullItemName.match(/^(.*?)\+(\d+)$/);
            if (match) {
                return { baseName: match[1], plus: parseInt(match[2], 10) };
            }
            return { baseName: fullItemName, plus: 0 };
        }

        // 動的なアイテムステータス算出
        function getDynamicItemStats(fullItemName) {
            const { baseName, plus } = parseItemName(fullItemName);
            const baseData = MASTER_DATABASE[baseName];
            if (!baseData) return null;

            const mult = getEnhancementMultiplier(plus);
            return {
                ...baseData,
                atk: baseData.atk ? Math.round(baseData.atk * mult) : 0,
                def: baseData.def ? Math.round(baseData.def * mult) : 0,
                maxHp: baseData.maxHp ? Math.round(baseData.maxHp * mult) : 0
            };
        }

        // --- 特殊判定: 「神喰」付き装備数をカウントする ---
        function getGodEquipCount() {
            let count = 0;
            const slots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            slots.forEach(slot => {
                const item = gameState[slot];
                if (item && item.includes("神喰")) {
                    count++;
                }
            });
            return count;
        }

        // --- 各種ステータス計算用 ---
        // --- 防具セット効果 ---
        // head/chest/legs の素材種別(布・革・鉄)が何種類そろっているかを数える。
        // 2種類 ➔ ATK+2% DEF+2% / 3種類(全部位) ➔ ATK+5% DEF+5%
        function getArmorSetBonus() {
            const parts = ["head", "chest", "legs"];
            const materials = new Set();
            parts.forEach(part => {
                const data = getDynamicItemStats(gameState[part]);
                if (data && data.category === "armor" && data.material) {
                    materials.add(data.material);
                }
            });
            if (materials.size >= 3) return 0.05;
            if (materials.size >= 2) return 0.02;
            return 0;
        }

        function getPlayerTotalAtk() {
            let total = gameState.baseAtk;

            // 各種装備の固定ATK加算 (強化値考慮)
            const slots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            slots.forEach(slot => {
                const item = gameState[slot];
                const data = getDynamicItemStats(item);
                if (data && data.atk) total += data.atk;
            });

            // 乗算バフ・タリスマン・使い魔計算
            let multiplier = 1.0;

            // 剣スキル: 魔斬撃のバフ (攻撃力+10%)
            if (gameState.playerBuffs && gameState.playerBuffs.swordAtkBuff > 0) {
                multiplier += 0.10;
                total += 5;
            }

            // タリスマン効果
            if (gameState.offHand && gameState.offHand.includes("タリスマン")) {
                const talName = gameState.offHand;
                const talLvl = gameState.talismanLevels[talName] || 1;
                if (talName === "攻撃のタリスマン") {
                    multiplier += 0.001 * talLvl; // 仕様書: レベル×0.1%増加
                } else if (talName === "神喰のタリスマン") {
                    const godCount = getGodEquipCount();
                    multiplier += 0.003 * godCount * talLvl; // 仕様書: 神喰装備数×レベル×0.3%
                }
            }

            // 使い魔補正 (オムニ)
            if (gameState.familiar === "オムニ") {
                const lvl = gameState.familiarLevels["オムニ"] || 1;
                multiplier += 0.01 * lvl;
            }

            // 🔮 鬼神の契約効果 (攻撃力+50%)
            if (gameState.contracts && gameState.contracts.demonCount > 0) {
                multiplier += 0.50;
            }

            // 🛡️ 防具セット効果
            multiplier += getArmorSetBonus();

            return Math.max(1, Math.floor(total * multiplier));
        }

        // 防御力計算
        function getPlayerTotalDef() {
            let total = gameState.baseDef;

            // 固定防御力加算 (強化値考慮)
            const slots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            slots.forEach(slot => {
                const item = gameState[slot];
                const data = getDynamicItemStats(item);
                if (data && data.def) total += data.def;
            });

            // 岩石バフ
            if (gameState.playerBuffs && gameState.playerBuffs.rockDef > 0) {
                total += 5;
            }

            // 乗算バフ
            let multiplier = 1.0;

            // タリスマン
            if (gameState.offHand && gameState.offHand.includes("タリスマン")) {
                const talName = gameState.offHand;
                const talLvl = gameState.talismanLevels[talName] || 1;
                if (talName === "物防のタリスマン") {
                    multiplier += 0.001 * talLvl;
                } else if (talName === "神喰のタリスマン") {
                    const godCount = getGodEquipCount();
                    multiplier += 0.003 * godCount * talLvl;
                }
            }

            // 使い魔 (オムニ)
            if (gameState.familiar === "オムニ") {
                const lvl = gameState.familiarLevels["オムニ"] || 1;
                multiplier += 0.01 * lvl;
            }

            // 🔮 冷塞の契約効果 (防御力+50%)
            if (gameState.contracts && gameState.contracts.freezeCount > 0) {
                multiplier += 0.50;
            }

            // 🛡️ 防具セット効果
            multiplier += getArmorSetBonus();

            return Math.max(0, Math.floor(total * multiplier));
        }

        // 最大HP計算
        function getPlayerMaxHp() {
            let hp = gameState.playerMaxHp;

            // 装備品の最大HP補正 (強化値考慮)
            const slots = ["offHand"];
            slots.forEach(slot => {
                const item = gameState[slot];
                const data = getDynamicItemStats(item);
                if (data && data.maxHp) hp += data.maxHp;
            });

            // タリスマン
            let multiplier = 1.0;
            if (gameState.offHand && gameState.offHand.includes("タリスマン")) {
                const talName = gameState.offHand;
                const talLvl = gameState.talismanLevels[talName] || 1;
                if (talName === "体力のタリスマン") {
                    multiplier += 0.001 * talLvl;
                } else if (talName === "神喰のタリスマン") {
                    const godCount = getGodEquipCount();
                    multiplier += 0.003 * godCount * talLvl;
                }
            }

            return Math.max(1, Math.floor(hp * multiplier));
        }

        // 獲得ゴールド補正
        function getGoldMultiplier() {
            let mult = 1.0;
            const slots = ["ring1", "ring2"];
            slots.forEach(slot => {
                const item = gameState[slot];
                const data = getDynamicItemStats(item);
                if (data && data.goldBonus) mult += data.goldBonus;
            });

            // 🔮 金錬の契約効果 (1レベルにつき+10%)
            if (gameState.contracts && gameState.contracts.goldLevel) {
                mult += gameState.contracts.goldLevel * 0.10;
            }

            return mult;
        }

        // 獲得経験値補正
        function getExpMultiplier() {
            let mult = 1.0;
            const slots = ["ring1", "ring2"];
            slots.forEach(slot => {
                const item = gameState[slot];
                const data = getDynamicItemStats(item);
                if (data && data.expBonus) mult += data.expBonus;
            });

            // 🔮 経験の契約効果 (1レベルにつき+10%)
            if (gameState.contracts && gameState.contracts.expLevel) {
                mult += gameState.contracts.expLevel * 0.10;
            }

            return mult;
        }

        // クリティカル率
        function getPlayerCritChance() {
            let chance = 0.15; // 基本15%

            // ランタン・オフハンド効果
            const offData = getDynamicItemStats(gameState.offHand);
            if (offData && offData.crit) chance += offData.crit;

            // 使い魔 (リッパー)
            if (gameState.familiar === "リッパー") {
                const lvl = gameState.familiarLevels["リッパー"] || 1;
                chance += 0.02 * lvl;
            }

            // タリスマン
            if (gameState.offHand && gameState.offHand.includes("タリスマン")) {
                const talName = gameState.offHand;
                const talLvl = gameState.talismanLevels[talName] || 1;
                if (talName === "畏怖のタリスマン") {                
                    chance += 0.001 * talLvl;
                }
            }

            return chance;
        }

        // クリティカル倍率
        function getPlayerCritDmgMultiplier() {
            let mult = 1.5; // 基本1.5倍

            // 香薬
            const offData = getDynamicItemStats(gameState.offHand);
            if (offData && offData.critDmg) mult += offData.critDmg;

            // タリスマン
            if (gameState.offHand && gameState.offHand.includes("タリスマン")) {
                const talName = gameState.offHand;
                const talLvl = gameState.talismanLevels[talName] || 1;
                if (talName === "脅威のタリスマン") {
                    mult += 0.001 * talLvl;
                }
            }

            return mult;
        }

        // エリアがロック解除されているかの判定
        // --- 実績チェック＆解除 ---
        // trigger: "explore" | "win" | "weapon" | "godWeapon" | "familiar" | "boss"
        // extra: 武器種別勝利なら武器種の文字列、ボス討伐ならボス名
        // 新規解除があれば writeText で通知し、gameState.achievementsUnlocked に積む。
        function checkAchievements(trigger, extra) {
            const newlyUnlocked = [];

            ACHIEVEMENT_DEFS.forEach(def => {
                if (gameState.achievementsUnlocked.includes(def.id)) return; // 既に解除済み

                let achieved = false;
                if (def.category === "explore" && trigger === "explore") {
                    achieved = (gameState.statsExploreCount || 0) >= def.threshold;
                } else if (def.category === "win" && trigger === "win") {
                    achieved = (gameState.statsWinCount || 0) >= def.threshold;
                } else if (def.category === "weapon" && trigger === "weapon" && extra === def.weaponType) {
                    achieved = (gameState.statsWinByWeaponType[def.weaponType] || 0) >= def.threshold;
                } else if (def.category === "godWeapon" && trigger === "godWeapon") {
                    achieved = countGodWeapons() >= def.threshold;
                } else if (def.category === "familiar" && trigger === "familiar") {
                    achieved = (gameState.familiarsUnlocked || []).length >= def.threshold;
                } else if (def.category === "boss" && trigger === "boss" && extra === def.bossName) {
                    achieved = true;
                }

                if (achieved) {
                    gameState.achievementsUnlocked.push(def.id);
                    newlyUnlocked.push(def);
                }
            });

            newlyUnlocked.forEach(def => {
                writeText(`\n🏅 【実績解除】${def.icon} 『${def.name}』\n${def.desc}`);
            });

            if (newlyUnlocked.length > 0) saveGame();
            return newlyUnlocked;
        }

        // 所持している★10武器(神喰装備)の種類数を数える（getGodEquipCount とは別：武器のみ・種類数）
        // 装備中のアイテムも inventory 配列に残り続ける実装のため、inventory だけ見ればよい。
        function countGodWeapons() {
            const godWeaponNames = Object.keys(WEAPONS_DEF).filter(n => WEAPONS_DEF[n].rarity === 10);
            const owned = new Set();
            gameState.inventory.forEach(itemName => {
                const { baseName } = parseItemName(itemName);
                if (godWeaponNames.includes(baseName)) owned.add(baseName);
            });
            return owned.size;
        }

        function isAreaUnlocked(areaName) {

            if (areaName === "フリメンド") return !!gameState.bossesDefeated["グラウンドクラッシャー"];
            if (areaName === "フォウント") return !!gameState.bossesDefeated["バーニーエンジェル"];
            if (areaName === "ノドーロ") return !!gameState.bossesDefeated["マドランティ"];
            if (areaName === "神喰") return (gameState.reincarnations || 0) >= 10;
            return false;
        }

        // エリアの切り替え
        function changeArea(newArea) {
            // 暗転している間に、エリア切り替えと再描画を行う
            playAreaTransition(newArea, null, () => {

        // サブエリアの切り替え

                saveGame();
                renderTabContent();
            });
        }

    <script>
        // --- DOM要素の取得 ---
        const textArea = document.getElementById("textArea");
        const tabContentArea = document.getElementById("tabContentArea");
        const nameForm = document.getElementById("nameForm");
        const actionArea = document.getElementById("actionArea");
        const navTabs = document.getElementById("navTabs");
        const playerNameInput = document.getElementById("playerNameInput");
        const battleHud = document.getElementById("battleHud");

        // --- エリア切り替えトランジション ---
        // 暗転 → (暗転中に) 中身を切り替え → エリア名を見せる → 明転。連打しても多重に走らない。
        // 合計の長さ = 暗転 + 停止 + 明転 = 1300ms （CSSの --area-fade-in / --area-fade-out と揃える）
        const AREA_FADE_IN_MS  = 350;   // 暗転にかかる時間
        const AREA_HOLD_MS     = 600;   // 真っ暗のままエリア名を見せる時間
        const AREA_FADE_OUT_MS = 350;   // 明けるのにかかる時間
        let isAreaTransitioning = false;

        function playAreaTransition(areaName, subName, switchFn) {
            // 戦闘中・オープニング中・連打中は演出なしで即切り替え（動作を壊さない）
            if (isAreaTransitioning || gameState.currentScene === "battle" || gameState.isOpeningActive) {
                if (!isAreaTransitioning) switchFn();
                return;
            }
            isAreaTransitioning = true;

            const container = document.querySelector(".game-container");
            const overlay = document.createElement("div");
            overlay.className = "area-transition is-active fade-in";
            // CSSのアニメーション時間をJSの数値に合わせる（片方だけ変えてズレるのを防ぐ）
            overlay.style.setProperty("--area-fade-in", AREA_FADE_IN_MS + "ms");
            overlay.style.setProperty("--area-fade-out", AREA_FADE_OUT_MS + "ms");

            // 表示名：サブエリアがあれば「エリア名」+「サブエリア名(推奨Lv表記を除く)」
            const nameEl = document.createElement("div");
            nameEl.className = "area-transition-name";
            nameEl.textContent = areaName;
            overlay.appendChild(nameEl);

            if (subName && AREAS_DB[areaName] && AREAS_DB[areaName].subAreas[subName]) {
                const subEl = document.createElement("div");
                subEl.className = "area-transition-sub";
                subEl.textContent = String(AREAS_DB[areaName].subAreas[subName].displayName || subName)
                    .replace(/\s*[（(].*$/, "");
                overlay.appendChild(subEl);
            }
            container.appendChild(overlay);

            // ① 暗転が完了したら、中身を切り替える
            setTimeout(() => {
                try { switchFn(); } catch (e) { console.error(e); }
                actionArea.classList.remove("panel-reveal");
                void actionArea.offsetWidth;            // アニメーションを再始動
                actionArea.classList.add("panel-reveal");

                // ② 名前を見せてから明転
                setTimeout(() => {
                    overlay.classList.remove("fade-in");
                    overlay.classList.add("fade-out");
                    overlay.classList.remove("is-active");

                    // ③ 明転が終わったら片付け
                    setTimeout(() => {
                        overlay.remove();
                        isAreaTransitioning = false;
                    }, AREA_FADE_OUT_MS);
                }, AREA_HOLD_MS);
            }, AREA_FADE_IN_MS);
        }

        // --- タイピング表示システム ---
        let textQueue = [];
        let isTyping = false;
        let onQueueComplete = null;

        function enqueueText(text, callback) {
            if (callback) onQueueComplete = callback;
            textQueue.push(text);
            if (!isTyping) {
                processTextQueue();
            }
        }

        function processTextQueue() {
            if (textQueue.length === 0) {
                isTyping = false;
                if (onQueueComplete) {
                    const cb = onQueueComplete;
                    onQueueComplete = null;
                    cb();
                }
                return;
            }
            isTyping = true;
            const text = textQueue.shift();
            const p = document.createElement("p");
            p.className = "log-text";
            textArea.appendChild(p);
            textArea.scrollTop = textArea.scrollHeight;

            let charIndex = 0;
            function typeChar() {
                if (charIndex < text.length) {
                    p.innerText += text.charAt(charIndex);
                    charIndex++;
                    textArea.scrollTop = textArea.scrollHeight;
                    setTimeout(typeChar, 36);
                } else {
                    setTimeout(processTextQueue, 300);
                }
            }
            typeChar();
        }

        function writeText(text) {
            // ① ログ欄には常に記録する（ホームに戻った時に読めるように）
            const p = document.createElement("p");
            p.className = "log-text";
            p.innerText = text;
            textArea.appendChild(p);
            textArea.scrollTop = textArea.scrollHeight;

            // ② ホーム以外のタブを見ている時は、ログ欄が隠れているので通知として上から出す
            if (isLogHiddenTab()) {
                showToast(text);
            }
        }

        // CSSがタブごとにレイアウトを切り替えられるよう、コンテナに現在のタブ名を持たせる
        function syncTabAttr() {
            const c = document.getElementById("gameContainer");
            if (c) c.dataset.tab = gameState.currentTab || "home";
        }

        // ログ欄が見えていない状態か？（戦闘中とホームタブ以外＝見えない）
        function isLogHiddenTab() {
            return gameState.currentScene !== "battle"
                && !gameState.isOpeningActive
                && gameState.currentTab !== "home";
        }

        // --- プッシュ通知風トースト ---
        // 画面上部から降りてくる。複数出た時は縦に積み、時間が来た順に消える。
        const TOAST_MAX = 2;            // 同時に出す最大数（超えたら古いものから消す）
        const TOAST_DURATION = 2800;    // 表示時間(ms)

        function showToast(text) {
            const container = document.getElementById("toastContainer");
            if (!container) return;

            const clean = String(text).replace(/^\s+/, "");            // 先頭の改行を除く
            const isError = /^[❌⚠]/.test(clean) || clean.includes("不可") || clean.includes("失敗") || clean.includes("足りない");

            const toast = document.createElement("div");
            toast.className = "toast" + (isError ? " toast-error" : "");
            toast.setAttribute("role", "status");
            toast.textContent = clean;
            toast.addEventListener("click", () => dismissToast(toast));   // タップで即消し
            container.appendChild(toast);

            // 上限を超えたら、一番古いものを消す
            const all = container.querySelectorAll(".toast:not(.leaving)");
            if (all.length > TOAST_MAX) dismissToast(all[0]);

            toast._timer = setTimeout(() => dismissToast(toast), TOAST_DURATION);
        }

        function dismissToast(toast) {
            if (!toast || toast.classList.contains("leaving")) return;
            clearTimeout(toast._timer);
            toast.classList.add("leaving");
            setTimeout(() => toast.remove(), 300);
        }

        // 画面遷移などで、出ている通知を全部片付ける
        function clearToasts() {
            const container = document.getElementById("toastContainer");
            if (container) container.innerHTML = "";
        }

        function clearText() {
            textQueue = [];
            isTyping = false;
            textArea.innerHTML = "";
        }

        function setChoices(choices) {
            actionArea.innerHTML = "";
            if (choices.length === 0) {
                actionArea.style.minHeight = "0px";
                return;
            }
            actionArea.style.minHeight = "80px";
            choices.forEach(choice => {
                const button = document.createElement("button");
                button.className = "btn";
                button.innerText = choice.text;
                button.onclick = choice.action;
                if (choice.disabled) {
                    button.disabled = true;
                }
                actionArea.appendChild(button);
            });
        }

        // --- タブ切り替えシステム ---
        function switchTab(tabName) {
            if (gameState.isOpeningActive) return;
            if (gameState.currentScene === "battle") {
                return; // 戦闘中はガード
            }
            gameState.currentTab = tabName;
            syncTabAttr();
            if (typeof resetPendingSell === "function") resetPendingSell();
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            const targetBtn = document.getElementById(`tab-${tabName}`);
            if (targetBtn) targetBtn.classList.add("active");
            renderTabContent();

            // ホームに戻った時：通知は片付けて、ログ欄は最新（一番下）まで送る
            if (tabName === "home") {
                clearToasts();
                requestAnimationFrame(() => { textArea.scrollTop = textArea.scrollHeight; });
            }
        }

        function switchPrepSubTab(subTabName) {
            gameState.prepSubTab = subTabName;
            renderTabContent();
        }

        function switchEquipCategory(categoryName) {
            gameState.equipCategoryFilter = categoryName;
            renderTabContent();
        }

        // --- 闇市商品自動生成システム ---
        function generateBlackMarketProducts() {
            gameState.blackMarketProducts = [];
            const allItemsArray = Object.keys(MASTER_DATABASE).filter(name => {
                const data = MASTER_DATABASE[name];
                return data.category !== "talisman";
            });
            
            while (gameState.blackMarketProducts.length < 6) {
                const rand = Math.random() * 100;
                let targetRarity = 4;
                
                if (rand < 50) targetRarity = 4;
                else if (rand < 85) targetRarity = 5;
                else if (rand < 92) targetRarity = 6;
                else if (rand < 96) targetRarity = 7;
                else if (rand < 99) targetRarity = 8;
                else targetRarity = 9;

                const matchItems = allItemsArray.filter(name => MASTER_DATABASE[name].rarity === targetRarity);
                if (matchItems.length > 0) {
                    const picked = matchItems[Math.floor(Math.random() * matchItems.length)];
                    if (!gameState.blackMarketProducts.some(p => p.name === picked)) {
                        gameState.blackMarketProducts.push({ name: picked, sold: false });
                    }
                }
            }
            gameState.actionsUntilRefresh = Math.floor(Math.random() * 7) + 8;
        }

        // --- 行動消費処理 ---
        function consumeAction() {
            if (gameState.actionsUntilRefresh > 0) {
                gameState.actionsUntilRefresh--;
                if (gameState.actionsUntilRefresh <= 0) {
                    generateBlackMarketProducts();
                    writeText("\n🏪【闇市】路地裏が霧に包まれ、闇市に新たな装備が入荷したようだ...");
                }
            }
        }

        // 価格計算
        function getBuyPrice(itemName) {
            const item = getDynamicItemStats(itemName);
            if (!item) return 0;
            switch(item.rarity) {
                case 4: return 15000;
                case 5: return 45000;
                case 6: return 75000;
                case 7: return 150000;
                case 8: return 3500000;
                case 9: return 11250000;
                default: return 0;
            }
        }

        // 売却価格計算
        function getSellPrice(fullItemName) {
            const { baseName, plus } = parseItemName(fullItemName);
            const item = MASTER_DATABASE[baseName];
            if (!item) return 0;
            const isElement = item.attr && item.attr !== "物理";
            let basePrice = 0;
            if (item.rarity <= 3) {
                if (item.rarity === 1) basePrice = 20;
                else if (item.rarity === 2) basePrice = 35;
                else if (item.rarity === 3) basePrice = 50;
            } else {
                switch(item.rarity) {
                    case 4: basePrice = isElement ? 150 : 100; break;
                    case 5: basePrice = isElement ? 450 : 300; break;
                    case 6: basePrice = isElement ? 750 : 500; break;
                    case 7: basePrice = isElement ? 1500 : 1000; break;
                    case 8: basePrice = isElement ? 20000 : 20000; break;
                    case 9: basePrice = isElement ? 90000 : 75000; break;
                    case 10: basePrice = isElement ? 100000 : 80000; break;
                }
            }
            return basePrice * Math.pow(2, plus);
        }

        // --- 戦闘用HUD描画・更新システム ---
        function updateBattleHud() {
            if (gameState.currentScene === "battle" && gameState.activeEnemy) {
                battleHud.classList.remove("hidden");
                
                const pMaxHp = getPlayerMaxHp();
                const pPct = Math.max(0, Math.min(100, (gameState.playerHp / pMaxHp) * 100));
                
                const enemy = gameState.activeEnemy;
                const ePct = Math.max(0, Math.min(100, (enemy.hp / enemy.maxHp) * 100));

                let buffsBadge = "";
                if (gameState.contracts) {
                    if (gameState.contracts.demonCount > 0) {
                        buffsBadge += `<span style="background: #a61c1c; color: #fff; border: 1px solid #ff3333; padding: 1px 4px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; margin-left: 5px;">鬼神 ${gameState.contracts.demonCount}</span>`;
                    }
                    if (gameState.contracts.freezeCount > 0) {
                        buffsBadge += `<span style="background: #1c5fa6; color: #fff; border: 1px solid #33a2ff; padding: 1px 4px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; margin-left: 5px;">冷塞 ${gameState.contracts.freezeCount}</span>`;
                    }
                }
                if (gameState.playerBuffs) {
                    if (gameState.playerBuffs.swordAtkBuff > 0) {
                        buffsBadge += `<span style="background: #e65c00; color: #fff; border: 1px solid #ff9933; padding: 1px 4px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; margin-left: 5px;">魔斬 ${gameState.playerBuffs.swordAtkBuff}</span>`;
                    }
                    if (gameState.playerBuffs.drainBoltCount > 0) {
                        buffsBadge += `<span style="background: #00994d; color: #fff; border: 1px solid #33cc33; padding: 1px 4px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; margin-left: 5px;">吸ボルト ${gameState.playerBuffs.drainBoltCount}</span>`;
                    }
                }

                let enemyDebuffsBadge = "";
                if (gameState.enemyStates) {
                    if (gameState.enemyStates.defDown > 0) {
                        enemyDebuffsBadge += `<span style="background: #555555; color: #ffaa00; border: 1px solid #777; padding: 1px 4px; font-size: 0.7rem; border-radius: 3px; font-weight: bold; margin-left: 5px;">兜割 ${gameState.enemyStates.defDown}t</span>`;

                battleHud.innerHTML = `
                    <div class="hud-row">

                        </div>
                    </div>
                    <div class="hud-row">

                        <div class="hud-hp-wrapper">

                        </div>
                    </div>
                `;
            } else {
                battleHud.classList.add("hidden");
            }
        }

        function switchMenuSubTab(tabName) {

        // --- 左右分割式の「エリア選択・探索」コントロールパネルの描画 ---
        function renderHomeActions() {
            actionArea.style.minHeight = "100px";
            actionArea.innerHTML = "";

            const splitDiv = document.createElement("div");
            splitDiv.className = "action-split";

            // 左側カラム：エリア・サブエリア選択 dropdown
            const leftCol = document.createElement("div");
            leftCol.style.cssText = "display: flex; flex-direction: column; gap: 6px;";

            const areaLabel = document.createElement("div");
            areaLabel.style.cssText = "font-size: 0.75rem; color: #888; margin-bottom: -2px;";
            areaLabel.innerText = "📍 エリア選択👇🏻";
            leftCol.appendChild(areaLabel);

            const areaSel = document.createElement("select");
            areaSel.className = "styled-select";
            areaSel.onchange = (e) => changeArea(e.target.value);

            Object.keys(AREAS_DB).forEach(areaName => {
                const opt = document.createElement("option");
                opt.value = areaName;
                const unlocked = isAreaUnlocked(areaName);
                opt.innerText = areaName + (unlocked ? "" : " 🔒");
                opt.disabled = !unlocked;
                if (areaName === gameState.selectedArea) {
                    opt.selected = true;
                }
                areaSel.appendChild(opt);
            });
            leftCol.appendChild(areaSel);

            const subLabel = document.createElement("div");
            subLabel.style.cssText = "font-size: 0.75rem; color: #888; margin-bottom: -2px;";
            subLabel.innerText = "🗺️ エリアのどこを探索する？";
            leftCol.appendChild(subLabel);

            const subSel = document.createElement("select");
            subSel.className = "styled-select";
            subSel.onchange = (e) => changeSubArea(e.target.value);

            const currentArea = AREAS_DB[gameState.selectedArea] || AREAS_DB["ヴェールタウン"];
            // 推奨Lv表記 "(推奨Lv1~)" は選択肢の外に出すので、選択肢自体は地名だけにする
            Object.keys(currentArea.subAreas).forEach(subName => {
                const opt = document.createElement("option");
                opt.value = subName;
                opt.innerText = String(currentArea.subAreas[subName].displayName || subName).replace(/\s*[（(].*$/, "");
                if (subName === gameState.selectedSubArea) {
                    opt.selected = true;
                }
                subSel.appendChild(opt);
            });
            leftCol.appendChild(subSel);

            // 選んでいるサブエリアの推奨Lvを、選択肢の下に小さく表示する
            const selectedSubData = currentArea.subAreas[gameState.selectedSubArea];
            if (selectedSubData) {
                const fullName = String(selectedSubData.displayName || "");
                const recMatch = fullName.match(/[（(]([^）)]*)[）)]/); // "(推奨Lv1~)" の中身を取り出す
                if (recMatch) {
                    const recNote = document.createElement("div");
                    recNote.style.cssText = "font-size: 0.72rem; color: #ffb020; margin-top: -2px;";
                    recNote.innerText = "⚠ " + recMatch[1];
                    leftCol.appendChild(recNote);
                }
            }

            // 右側カラム：探索・ボス挑戦ボタン
            const rightCol = document.createElement("div");
            rightCol.style.cssText = "display: flex; flex-direction: column; gap: 8px; justify-content: center;";

            const exploreBtn = document.createElement("button");
            exploreBtn.className = "btn";
            exploreBtn.style.padding = "10px";
            exploreBtn.innerText = "👣 探索する";
            exploreBtn.onclick = () => startExploration();
            rightCol.appendChild(exploreBtn);

            const subData = currentArea.subAreas[gameState.selectedSubArea];
            if (subData && subData.boss) {
                const bossName = subData.boss.name;
                const isDefeated = !!gameState.bossesDefeated[bossName];

                const bossBtn = document.createElement("button");
                bossBtn.className = "btn";
                if (isDefeated) {
                    bossBtn.disabled = true;
                    bossBtn.style.cssText = "background: #111; color: #555; border-color: #222; font-size: 0.8rem; padding: 10px;";
                    bossBtn.innerText = `🏆 討伐済: ${bossName}`;
                } else {
                    bossBtn.style.cssText = "background: #5a0808; border-color: #ff3333; color: #fff; font-weight: bold; box-shadow: 0 0 8px rgba(255, 0, 0, 0.4); padding: 10px;";
                    bossBtn.innerText = `⚔️ ボス: ${bossName}`;
                    bossBtn.onclick = () => startBossBattle(subData.boss);
                }
                rightCol.appendChild(bossBtn);
            }

            splitDiv.appendChild(leftCol);
            splitDiv.appendChild(rightCol);
            actionArea.appendChild(splitDiv);
        }

        // --- データエクスポート (コード出力とコピー) ---
        function copyExportCode() {
            const area = document.getElementById("saveCodeArea");
            if (!area) return;
            const dataStr = JSON.stringify(gameState);
            area.value = dataStr;
            area.select();
            try {
                document.execCommand('copy');
                writeText("\n📋【システム】セーブコードをクリップボードにコピーしました！");
            } catch (err) {
                writeText("\n📋【システム】セーブコードを出力しました。上の枠内のテキストをコピーしてください。");
            }
        }

        // --- データインポート (コード読み込みと反映) ---
        function pasteImportCode() {
            const area = document.getElementById("saveCodeArea");
            if (!area) return;
            const code = area.value.trim();
            if (!code) {
                writeText("\n❌【システム】上の枠内にセーブコードを貼り付けてからインポートを押してください。");
                return;
            }
            try {
                const parsed = JSON.parse(code);
                if (parsed && typeof parsed === "object" && parsed.playerName) {
                    gameState = parsed;

                    if (gameState.blackMarketProducts) {
                        gameState.blackMarketProducts = gameState.blackMarketProducts.map(p => {
                            if (typeof p === "string") {
                                return { name: p, sold: false };
                            }
                            return p;
                        });
                    }

                    saveGame();
                    writeText(`\n📥【システム】勇者 『${gameState.playerName}』 のデータを正常に復元しました！`);
                    
                    gameState.currentTab = "home";
                    syncTabAttr();
                    document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
                    const homeBtn = document.getElementById("tab-home");
                    if (homeBtn) homeBtn.classList.add("active");
                    renderTabContent();
                } else {
                    writeText("\n❌【システム】データが不正です。適切な勇者のセーブデータではありません。");
                }
            } catch (e) {
                writeText("\n❌【システム】セーブコードの解析に失敗しました。正しいコードか確認してください。");
            }
        }

        // --- 🔮 契約署名処理 ---
        function signContract(type, cost) {
            if (gameState.isOpeningActive) return;
            if (gameState.playerGold < cost) {
                writeText(`\n❌【契約】ゴールドが足りないようだな…（必要: ${fmtG(cost)} G）`);
                return;
            }

            gameState.playerGold -= cost;

            if (type === 'exp') {
                gameState.contracts.expLevel = (gameState.contracts.expLevel || 0) + 1;
                writeText(`\n🔮【契約締結】『経験の契約』が Lv.${gameState.contracts.expLevel} に上昇！`);
            } else if (type === 'gold') {
                gameState.contracts.goldLevel = (gameState.contracts.goldLevel || 0) + 1;
                writeText(`\n🔮【契約締結】『金錬の契約』が Lv.${gameState.contracts.goldLevel} に上昇！`);
            } else if (type === 'greedy') {
                gameState.contracts.greedyCount = 5;
                writeText(`\n🔮【契約締結】『貪欲の契約』を交わした！残り5回の戦闘でドロップ率増加！`);
            } else if (type === 'demon') {
                gameState.contracts.demonCount = 2;
                writeText(`\n🔮【契約締結】『鬼神の契約』を交わした！残り2回の戦闘で攻撃力+50%！`);
            } else if (type === 'freeze') {
                gameState.contracts.freezeCount = 2;
                writeText(`\n🔮【契約締結】『冷塞の契約』を交わした！残り2回の戦闘で防御力+50%！`);
            }

            saveGame();
            renderTabContent();
        }

        // --- ⚒️ 装備合成実行ロジック ---
        // +0 ~ +9 は素材3個の通常合成で +10 まで到達可能。
        // +10 以上（+11~+15 へ進める合成）は、素材3個に加えて「特殊強化石」を1個消費する。
        // +15 が最終上限で、それ以上は合成できない。
        const SYNTH_NORMAL_CAP = 10;   // この強化値までは通常合成のみで到達できる
        const SYNTH_HARD_CAP = 15;     // 絶対上限（特殊強化石を使っても、これ以上は合成不可）

        function executeSynthesize(itemName) {
            if (gameState.isOpeningActive) return;

            const { plus } = parseItemName(itemName);

            if (plus >= SYNTH_HARD_CAP) {
                writeText(`\n❌【合成不可】『${itemName}』は既に上限(+${SYNTH_HARD_CAP})に達しています。`);
                return;
            }

            const needsStone = plus >= SYNTH_NORMAL_CAP; // 次の強化値が+11以上になる場合
            if (needsStone && (gameState.specialEnhanceStones || 0) < 1) {
                writeText(`\n❌【合成失敗】+${SYNTH_NORMAL_CAP}を超える強化には『特殊強化石』が1個必要です。（エリアボスを倒すと入手できます）`);
                return;
            }

            const matchingIndices = [];
            gameState.inventory.forEach((name, idx) => {
                if (name === itemName) matchingIndices.push(idx);
            });

            if (matchingIndices.length < 3) {
                writeText(`\n❌【合成失敗】『${itemName}』の所持数が3個未満です。`);
                return;
            }

            const equippedSlots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            let unequippedCount = 0;

            equippedSlots.forEach(slot => {
                if (gameState[slot] === itemName && unequippedCount < 3) {
                    unequipItemSlot(slot);
                    unequippedCount++;
                }
            });

            const targetIndices = matchingIndices.slice(-3).sort((a, b) => b - a);
            targetIndices.forEach(idx => {
                gameState.inventory.splice(idx, 1);
            });

            if (needsStone) {
                gameState.specialEnhanceStones -= 1;
            }

            const { baseName } = parseItemName(itemName);
            const nextPlusName = `${baseName}+${plus + 1}`;
            gameState.inventory.push(nextPlusName);

            writeText(`\n⚒️【装備合成】『${itemName}』は不思議な力で融合し、強化された！${needsStone ? `（特殊強化石を1個消費。残り: ${gameState.specialEnhanceStones}個）` : ''}`);
            
            saveGame();
            renderTabContent();
        }


</script>

        function resetGame() {
            const overlay = document.createElement("div");
            overlay.id = "resetOverlay";

        // --- 装備変更・着脱システム ---
        function equipItem(itemName) {
            const item = getDynamicItemStats(itemName);
            if (!item) return;

            const equippedSlots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            let eqCount = 0;
            equippedSlots.forEach(s => {
                if (gameState[s] === itemName) eqCount++;
            });
            const invCount = gameState.inventory.filter(name => name === itemName).length;

            if (eqCount >= invCount) {
                writeText(`\n❌【装備不可】『${itemName}』はすべて装備中です。追加の予備がありません！`);
                return;
            }

            if (item.category === "weapon") {
                gameState.mainHand = itemName;
                if (item.slot === "two-hand") {
                    if (gameState.offHand !== "空き" && gameState.offHand !== "⚔️両手武器装備中⚔️") {
                        writeText(`【装備】両手武器装着に伴い、オフハンドの『${gameState.offHand}』を外しました。`);
                    }
                    gameState.offHand = "⚔️両手武器装備中⚔️";
                    writeText(`【装備】『${itemName}』を両手で力強く構えた。`);
                } else {
                    if (gameState.offHand === "⚔️両手武器装備中⚔️") {
                        gameState.offHand = "空き";
                    }
                    writeText(`【装備】『${itemName}』をメインハンドに装備した。`);
                }
            }
            else if (item.category === "armor") {
                const part = item.bodyPart;
                gameState[part] = itemName;
                writeText(`【装備】『${itemName}』を${part === "head" ? "頭部" : part === "chest" ? "胴部" : "脚部"}に装着した。`);
            }
            else if (item.category === "accessory") {
                const isRing = item.accType === "ring";
                if (isRing) {
                    if (gameState.ring1 === "なし") {
                        gameState.ring1 = itemName;
                    } else if (gameState.ring2 === "なし") {
                        gameState.ring2 = itemName;
                    } else {
                        gameState.ring1 = itemName;
                    }
                } else {
                    if (gameState.bracelet1 === "なし") {
                        gameState.bracelet1 = itemName;
                    } else if (gameState.bracelet2 === "なし") {
                        gameState.bracelet2 = itemName;
                    } else {
                        gameState.bracelet1 = itemName;
                    }
                }
                writeText(`【装備】アクセサリー『${itemName}』を装着した。`);
            }
            else if (item.category === "offhand" || item.category === "talisman") {
                const mainWeapon = getDynamicItemStats(gameState.mainHand);
                if (!mainWeapon || mainWeapon.slot !== "one-hand") {
                    writeText(`\n❌【装備不可】両手武器を構えているか、メインハンドが空の状態では、オフハンドに装備できません！`);
                    return;
                }

                if (item.offhandType === "shield" && mainWeapon.type !== "剣") {
                    writeText(`\n❌【装備不可】盾はメインハンドに「剣」を装備している時のみ使用可能です。`);
                    return;
                }
                if (item.offhandType === "orb" && mainWeapon.type !== "杖") {
                    writeText(`\n❌【装備不可】オーブはメインハンドに「杖」を装備している時のみ使用可能です。`);
                    return;
                }
                if (item.offhandType === "incense" && mainWeapon.type !== "剣" && mainWeapon.type !== "短剣") {
                    writeText(`\n❌【装備不可】香薬はメインハンドに「剣」または「短剣」を装備している時のみ使用可能です。`);
                    return;
                }
                if (item.offhandType === "book" && mainWeapon.type !== "杖") {
                    writeText(`\n❌【装備不可】魔導書はメインハンドに「杖」を装備している時のみ使用可能です。`);
                    return;
                }
                if (item.offhandType === "lantern" && mainWeapon.type !== "短剣") {
                    writeText(`\n❌【装備不可】ランタンはメインハンドに「短剣」を装備している時のみ使用可能です。`);
                    return;
                }

                gameState.offHand = itemName;
                writeText(`【装備】オフハンドに『${itemName}』を構えた。`);
            }

            saveGame();
            renderTabContent();
        }

        // 装備スロットからアイテムを外す処理
        function unequipItemSlot(slotName) {
            const itemName = gameState[slotName];
            if (!itemName || itemName === "なし" || itemName === "空き" || itemName === "⚔️両手武器装備中⚔️") return;

            if (slotName === "mainHand") {
                gameState.mainHand = "なし";
                if (gameState.offHand === "⚔️両手武器装備中⚔️") {
                    gameState.offHand = "空き";
                }
                writeText(`【装備】メインハンドから『${itemName}』を外しました。`);
            } else if (slotName === "offHand") {
                gameState.offHand = "空き";
                writeText(`【装備】オフハンドから『${itemName}』を外しました。`);
            } else if (slotName.startsWith("ring") || slotName.startsWith("bracelet")) {
                gameState[slotName] = "なし";
                writeText(`【装備】アクセサリー『${itemName}』を外しました。`);
            } else {
                gameState[slotName] = "なし";
                writeText(`【装備】部位装備『${itemName}』を外しました。`);
            }

            saveGame();
            renderTabContent();
        }

        // 装備名から直接着脱
        function unequipItemByName(itemName) {
            const slots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            for (let slot of slots) {
                if (gameState[slot] === itemName) {
                    unequipItemSlot(slot);
                    return;
                }
            }
        }

        // 売却処理
        // 売却ボタンの2段階確認：1回目のタップで「本当に売る？」に変わり、
        // 2.5秒以内にもう一度押すと確定。他の場所を押す/タブを切り替えると自動でキャンセルされる。
        let pendingSellBtn = null;

        function handleSellClick(btn) {
            const idx = Number(btn.dataset.idx);

            if (btn.classList.contains("confirming")) {
                // 2回目のタップ → 確定
                resetPendingSell();
                sellItem(idx);
                return;
            }

            resetPendingSell(); // 他に確認中のボタンがあれば元に戻す

            btn.classList.add("confirming");
            btn.textContent = "本当に売る？";
            pendingSellBtn = btn;

            btn._sellTimer = setTimeout(() => resetPendingSell(), 2500);
        }

        function resetPendingSell() {
            if (!pendingSellBtn) return;
            clearTimeout(pendingSellBtn._sellTimer);
            pendingSellBtn.classList.remove("confirming");
            pendingSellBtn.textContent = `売却 ${fmtG(pendingSellBtn.dataset.sellVal)}G`;
            pendingSellBtn = null;
        }

        function sellItem(index) {
            if (index < 0 || index >= gameState.inventory.length) return;
            const itemName = gameState.inventory[index];
            
            const equippedSlots = ["mainHand", "offHand", "head", "chest", "legs", "ring1", "ring2", "bracelet1", "bracelet2"];
            const equippedCounts = {};
            equippedSlots.forEach(slot => {
                const name = gameState[slot];
                if (name && name !== "なし" && name !== "空き" && name !== "⚔️両手武器装備中⚔️") {
                    equippedCounts[name] = (equippedCounts[name] || 0) + 1;
                }
            });

            const invCount = gameState.inventory.filter(name => name === itemName).length;
            const eqCount = equippedCounts[itemName] || 0;

            if (eqCount > 0 && invCount <= eqCount) {
                writeText(`\n❌【システム】装備中の装備は売却できません！`);
                return;
            }

            const goldEarned = getSellPrice(itemName);
            gameState.playerGold += goldEarned;
            gameState.inventory.splice(index, 1);
            writeText(`\n💰【売却】『${itemName}』を売り払い、${fmtG(goldEarned)} ゴールドを獲得した。`);
            saveGame();
            renderTabContent();
        }

        // 購入処理
        function buyItem(itemName, shopIndex) {
            const product = gameState.blackMarketProducts[shopIndex];
            if (!product) return;

            if (product.sold) {
                writeText("\n❌【闇市】…それはもう売り切れだ。他の品を探しな。");
                return;
            }

            const price = getBuyPrice(itemName);
            if (gameState.playerGold < price) {
                writeText("\n❌【闇市】…金が足りないな、出直してきな。");
                return;
            }

            gameState.playerGold -= price;
            gameState.inventory.push(itemName);

            product.sold = true;

            writeText(`\n⚔️【闇市】…どうもな。その『${itemName}』大切に使えよ…。`);
            saveGame();
            renderTabContent();
        }

        // --- 使い魔関連 ---
        function craftFamiliar(famName, reqMat) {
            const currentLvl = gameState.familiarLevels[famName] || 0;
            const cost = (currentLvl + 1) * 5;

            if ((gameState.materials[reqMat] || 0) < cost) {
                writeText(`\n❌【使い魔】${reqMat}が足りないため錬成できません。`);
                return;
            }
            gameState.materials[reqMat] -= cost;
            gameState.familiarsUnlocked.push(famName);
            gameState.familiarLevels[famName] = 1;
            writeText(`\n🔮【使い魔錬成】${cost}個の${reqMat}を一点に集める！ 使い魔『${famName}』(Lv.1) と魂が共鳴する！`);
            checkAchievements("familiar");
            saveGame();
            renderTabContent();
        }

        function upgradeFamiliar(famName, reqMat) {
            const currentLvl = gameState.familiarLevels[famName] || 1;
            const cost = (currentLvl + 1) * 5;

            if ((gameState.materials[reqMat] || 0) < cost) {
                writeText(`\n❌【使い魔】${reqMat}が足りないため強化できません。`);
